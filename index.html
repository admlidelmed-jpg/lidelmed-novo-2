<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lidelmed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>LIDEL MED</h1>
</header>

<div class="marquee">
    <div class="marquee-content">
        <span class="marquee-item">FRETE GRÁTIS PARA ITABUNA E ILHÉUS</span>
    </div>
</div>

<button id="btnInstalar">BAIXAR APLICATIVO</button>

<div id="grid"></div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span class="fechar" onclick="fecharModal()">&times;</span>
        <button class="seta anterior" onclick="trocarProduto(-1)">&#10094;</button>
        <img id="modalImg" src="" alt="">
        <h3 id="modalNome"></h3>
        <p class="preco" id="modalAVista"></p>
        <p class="cartao" id="modalAp"></p>
        <a id="modalZap" href="#" target="_blank" class="btnZapProduto">PEDIR NO WHATSAPP</a>
        <button class="seta proximo" onclick="trocarProduto(1)">&#10095;</button>
    </div>
</div>

<script>
let deferredPrompt;
let produtos = [];
let produtoAtual = 0;

const grid = document.getElementById('grid');
const modal = document.getElementById('modal');

fetch('produtos.json')
.then(res => res.json())
.then(data => {
    produtos = data;
    mostrarProdutos();
});

function mostrarProdutos(){
    grid.innerHTML = '';
    produtos.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = 'product';
        card.innerHTML = `
            <img src="${p.imagem}" alt="${p.nome}">
            <h3>${p.nome}</h3>
            <p class="preco">${p.avista}</p>
            <p class="cartao">${p.aprazo}</p>
        `;
        card.onclick = () => abrirModal(i);
        grid.appendChild(card);
    });
}

function abrirModal(i){
    produtoAtual = i;
    const p = produtos[i];
    document.getElementById('modalImg').src = p.imagem;
    document.getElementById('modalNome').innerText = p.nome;
    document.getElementById('modalAVista').innerText = p.avista;
    document.getElementById('modalAp').innerText = p.aprazo;
    document.getElementById('modalZap').href = https://wa.me/5573999999?text=Olá, quero o produto: ${p.nome};
    modal.style.display = 'block';
}

function fecharModal(){
    modal.style.display = 'none';
}

function trocarProduto(d){
    produtoAtual = (produtoAtual + d + produtos.length) % produtos.length;
    abrirModal(produtoAtual);
}

window.onclick = function(event) {
    if (event.target == modal) {
        fecharModal();
    }
}

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('btnInstalar').style.display = 'block';
});

document.getElementById('btnInstalar').addEventListener('click', () => {
    deferredPrompt.prompt();
});
</script>

</body>
</html>
