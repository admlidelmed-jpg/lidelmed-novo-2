<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIDEL MED</title>
<link rel="manifest" href="manifest.json">
<style>
body{font-family:Arial,sans-serif;margin:0;padding:0;background:#f5f5f5}
header{background:#FFD700;padding:15px;text-align:center}
header h1{margin:0;color:#c00;border:2px solid #c00;display:inline-block;padding:5px 15px;border-radius:5px;background:white;font-size:18px}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
@media (min-width:768px){#grid{grid-template-columns:repeat(4,1fr);gap:20px;padding:20px}}
.produto{background:white;border-radius:10px;padding:10px;box-shadow:0 2px 5px rgba(0,0,0,.1);text-align:center;cursor:pointer}
.produto img{max-width:100%;height:120px;object-fit:contain}
.produto h3{font-size:13px;margin:8px 0;color:#333;min-height:32px}
.preco{font-weight:bold;color:#c00;font-size:14px;margin:3px 0}
.cartao{font-size:12px;color:#666;margin:3px 0}
#btnInstalar{display:none;position:fixed;bottom:20px;right:20px;z-index:999;padding:14px 20px;font-size:16px;background:#25D366;color:white;border:none;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:pointer}
.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.9);justify-content:center;align-items:center;flex-direction:column}
.modal-content{background:white;padding:20px;border-radius:10px;width:90%;max-width:400px;text-align:center;position:relative}
.modal img{max-width:100%;height:250px;object-fit:contain}
.fechar{position:absolute;top:10px;right:15px;font-size:28px;color:#c00;cursor:pointer;font-weight:bold}
.seta{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;color:#333;background:rgba(255,255,255,0.8);border:none;border-radius:50%;width:40px;height:40px;cursor:pointer}
.anterior{left:-20px}
.proximo{right:-20px}
</style>
</head>
<body>

<header><h1>LIDEL MED</h1></header>
<button id="btnInstalar">📱 BAIXAR APLICATIVO</button>
<div id="grid"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="fechar" onclick="fecharModal()">&times;</span>
    <button class="seta anterior" onclick="trocarProduto(-1)">&#10094;</button>
    <img id="modalImg">
    <h3 id="modalNome"></h3>
    <p class="preco" id="modalAVista"></p>
    <p class="cartao" id="modalCartao"></p>
    <button class="seta proximo" onclick="trocarProduto(1)">&#10095;</button>
  </div>
</div>

<script>
let deferredPrompt;
let produtos = [];
let produtoAtual = 0;

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('btnInstalar').style.display='block'});
document.getElementById('btnInstalar').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}};

fetch('produtos.json').then(r=>r.json()).then(d=>{
produtos = d;
const grid = document.getElementById('grid');
grid.innerHTML = produtos.map((p,i)=>{
// PEGA O PREÇO DE QUALQUER JEITO
let avista = p.precoAVista || p.preco_a_vista || p.avista || p.preco || 'Consulte';
let cartao = p.precoCartao || p.preco_cartao || p.cartao || 'Consulte';
return`
<div class="produto" onclick="abrirModal(${i})">
<img src="${p.imagem}">
<h3>${p.nome}</h3>
<p class="preco">À vista: ${avista}</p>
<p class="cartao">Cartão: ${cartao}</p>
</div>`}).join('')
});

function abrirModal(indice){produtoAtual=indice;document.getElementById('modal').style.display='flex';atualizarModal()}
function fecharModal(){document.getElementById('modal').style.display='none'}
function trocarProduto(direcao){produtoAtual=produtoAtual+direcao;if(produtoAtual<0)produtoAtual=produtos.length-1;if(produtoAtual>=produtos.length)produtoAtual=0;atualizarModal()}
function atualizarModal(){
let p=produtos[produtoAtual];
let avista = p.precoAVista || p.preco_a_vista || p.avista || p.preco || 'Consulte';
let cartao = p.precoCartao || p.preco_cartao || p.cartao || 'Consulte';
document.getElementById('modalImg').src=p.imagem;
document.getElementById('modalNome').innerText=p.nome;
document.getElementById('modalAVista').innerText='À vista: '+avista;
document.getElementById('modalCartao').innerText='Cartão: '+cartao;
}
window.onclick=function(event){if(event.target==document.getElementById('modal')){fecharModal()}}
</script>

</body>
</html>
