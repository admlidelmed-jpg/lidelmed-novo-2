<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIDEL MED</title>
<style>
body {font-family: Arial; margin: 0; background: #FFE4B0;}
header {background: #FFD700; padding: 15px; text-align: center;}
header h1 {margin: 0; color: #B22222; font-size: 18px;}
.marquee {background: #B22222; color: white; padding: 10px; font-weight: bold; overflow: hidden;}
.marquee span {display: inline-block; padding-left: 100%; animation: marquee 15s linear infinite;}
@keyframes marquee {0% {transform: translateX(0);} 100% {transform: translateX(-100%);}}
#grid {display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px;}
@media (min-width: 768px) {#grid {grid-template-columns: repeat(4, 1fr);}}
.produto {background: white; border-radius: 10px; padding: 15px; text-align: center;}
.produto img {max-width: 100%; height: 140px; object-fit: contain;}
.preco {font-weight: bold; color: #B22222;}
.btnZap {display:block; background:#25D366; color:white; padding:10px; border-radius:8px; text-decoration:none; margin-top:5px;}
</style>
</head>
<body>
<header><h1>LIDEL MED - Produtos Hospitalares e Ortopédicos</h1></header>
<div class="marquee"><span>🚚 FRETE GRÁTIS PARA ITABUNA E REGIÃO | 💬 ATENDIMENTO PELO WHATSAPP | 🏥 MELHORES PREÇOS!</span></div>
<div id="grid">Carregando produtos...</div>

<script>
const numeroZap = "+5573999144898";
fetch('produtos.json')
.then(r => r.json())
.then(d => {
  const grid = document.getElementById('grid');
  grid.innerHTML = d.map(p => {
    let avista = p.preco_avista == 0 ? 'Consultar' : 'R$ ' + parseFloat(p.preco_avista).toFixed(2).replace('.',',');
    let cartao = p.preco_cartao == 0 ? 'Consultar' : 'R$ ' + parseFloat(p.preco_cartao).toFixed(2).replace('.',',');
    let msg = encodeURIComponent(Olá! Tenho interesse no produto: ${p.nome});
    return <div class="produto"><img src="${p.imagem}"><h3>${p.nome}</h3><p class="preco">À vista: ${avista}</p><p>Cartão: ${cartao}</p><a href="https://wa.me/${numeroZap}?text=${msg}" target="_blank" class="btnZap">💬 WHATSAPP</a></div>
  }).join('');
})
.catch(() => {document.getElementById('grid').innerHTML = 'Erro ao carregar produtos'});
</script>
</body>
</html>
