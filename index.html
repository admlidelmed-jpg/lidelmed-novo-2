 100% { transform: translateX(-50%); }
}
</style>
</header>

<button id="btnInstalar">📲 BAIXAR APLICATIVO</button>
<button id="btnInstalar" style="display:block; margin: 20px auto; padding: 15px 30px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;">📲 BAIXAR APLICATIVO</button>
<div id="grid"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="fechar" onclick="fecharModal()">&times;</span>
    <button class="seta anterior" onclick="trocarProduto(-1)">&#10094;</button>
    <img id="modalImg">
    <h3 id="modalNome"></h3>
    <p class="preco" id="modalAVista"></p>
    <p class="cartao" id="modalCartao"></p>
    <a id="modalZap" href="#" target="_blank" class="btnZapProduto">💬 PEDIR NO WHATSAPP</a>
    <button class="seta proximo" onclick="trocarProduto(1)">&#10095;</button>
  </div>
</div>

<script>
let deferredPrompt;
let produtos = [];
let produtoAtual = 0;
const numeroZap = "5573999144898"; // SEU NUMERO

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('btnInstalar').style.display='block'});
document.getElementById('btnInstalar').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}};

fetch('produtos.json').then(r=>r.json()).then(d=>{
produtos = d;
const grid = document.getElementById('grid');
grid.innerHTML = produtos.map((p,i)=>{
let avista = p.preco_avista;
let cartao = p.preco_cartao;
let msg = encodeURIComponent(`Olá! Tenho interesse no produto: ${p.nome} - À vista: R$ ${avista}`);

return`
<div class="produto" onclick="abrirModal(${i})">
<img src="${p.imagem}">
<h3>${p.nome}</h3>
<p class="preco">À vista: R$ ${avista}</p>
<p class="cartao">Cartão: R$ ${cartao}</p>
<a href="https://wa.me/${numeroZap}?text=${msg}" target="_blank" class="btnZapProduto" onclick="event.stopPropagation()">💬 WHATSAPP</a>
</div>`}).join('')
});

function abrirModal(indice){
produtoAtual=indice;
let p=produtos[produtoAtual];
let msg = encodeURIComponent(`Olá! Tenho interesse no produto: ${p.nome} - À vista: R$ ${p.preco_avista}`);
document.getElementById('modalImg').src=p.imagem;
document.getElementById('modalNome').innerText=p.nome;
document.getElementById('modalAVista').innerText='À vista: R$ '+p.preco_avista;
document.getElementById('modalCartao').innerText='Cartão: R$ '+p.preco_cartao;
document.getElementById('modalZap').href=`https://wa.me/${numeroZap}?text=${msg}`;
document.getElementById('modal').style.display='flex';
}
function fecharModal(){document.getElementById('modal').style.display='none'}
function trocarProduto(direcao){produtoAtual=produtoAtual+direcao;if(produtoAtual<0)produtoAtual=produtos.length-1;if(produtoAtual>=produtos.length)produtoAtual=0;abrirModal(produtoAtual)}
window.onclick=function(event){if(event.target==document.getElementById('modal')){fecharModal()}}
</script>

</body>
</html>
