<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lidelmed</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
    <h1>Lidelmed</h1>
    <div class="marquee">
        <div class="marquee-content">
            <span class="marquee-item">FRETE GRÁTIS PARA ITABUNA E ILHÉUS</span>
        </div>
    </div>
</header>

<main>
    <input type="text" id="searchInput" placeholder="Pesquisar produto...">
    <div id="grid" class="grid"></div>
</main>

<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <img id="modalImg" src="" alt="">
        <h2 id="modalNome"></h2>
        <p id="modalAVista"></p>
        <p id="modalAP"></p>
        <a id="modalZap" href="#" target="_blank">Falar no WhatsApp</a>
        <div class="modal-nav">
            <button id="prevBtn">Anterior</button>
            <button id="nextBtn">Próximo</button>
        </div>
    </div>
</div>

<script>
let produtos = [];
let produtoAtual = 0;

const grid = document.getElementById('grid');
const modal = document.getElementById('modal');

fetch('/produtos.json')
.then(res => res.json())
.then(data => {
    produtos = data;
    mostrarProdutos();
});

function mostrarProdutos(){
    grid.innerHTML = '';
    produtos.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = 'product';
        card.innerHTML = `
            <img src="${p.imagem}" alt="${p.nome}">
            <h3>${p.nome}</h3>
            <p class="preco">R$ ${p.preco_avista}</p>
            <p class="cartao">R$ ${p.preco_cartao} no cartão</p>
        `;
        card.onclick = () => abrirModal(i);
        grid.appendChild(card);
    });
}

function abrirModal(i){
    produtoAtual = i;
    const p = produtos[i];
    document.getElementById('modalImg').src = ${p.imagem};
    document.getElementById('modalNome').innerText = p.nome;
    document.getElementById('modalAVista').innerText = R$ ${p.preco_avista};
    document.getElementById('modalAP').innerText = R$ ${p.preco_cartao} no cartão;
    document.getElementById('modalZap').href = https://wa.me/557399144898?text=Olá, quero o produto: ${p.nome};
    modal.style.display = 'block';
}

document.querySelector('.close').onclick = () => modal.style.display = 'none';
document.getElementById('prevBtn').onclick = () => { if(produtoAtual > 0) abrirModal(produtoAtual - 1); }
document.getElementById('nextBtn').onclick = () => { if(produtoAtual < produtos.length - 1) abrirModal(produtoAtual + 1); }

document.getElementById('searchInput').addEventListener('input', (e) => {
    const termo = e.target.value.toLowerCase();
    const filtrados = produtos.filter(p => p.nome.toLowerCase().includes(termo));
    grid.innerHTML = '';
    filtrados.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = 'product';
        card.innerHTML = `
            <img src="/${p.imagem}" alt="${p.nome}">
            <h3>${p.nome}</h3>
            <p class="preco">R$ ${p.preco_avista}</p>
            <p class="cartao">R$ ${p.preco_cartao} no cartão</p>
        `;
        card.onclick = () => abrirModal(produtos.indexOf(p));
        grid.appendChild(card);
    });
});
</script>

</body>
</html>
