<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIDEL MED</title>
<meta name="theme-color" content="#007bff">
<style>
body { font-family: Arial; background: #ff9800; margin: 0; padding: 20px; }
.card { background: white; padding: 20px; border-radius: 15px; max-width: 600px; margin: auto; text-align: center; }
.btn { background: #ff6600; color: white; padding: 15px; border-radius: 10px; text-decoration: none; display: block; margin: 15px 0; font-weight: bold; }
.letreiro { background: #d32f2f; color: white; padding: 8px; margin: 10px 0; border-radius: 5px; overflow: hidden; white-space: nowrap; }
.letreiro p { display: inline-block; padding-left: 100%; animation: mover 15s linear infinite; margin: 0; }
@keyframes mover { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
.modal { display: none; position: fixed; z-index: 1; padding-top: 60px; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); }
.galeria-conteudo { margin: auto; display: block; max-width: 90%; }
.fechar { position: absolute; top: 15px; right: 35px; color: white; font-size: 40px; cursor: pointer; }
.seta { position: absolute; top: 50%; color: white; font-size: 40px; cursor: pointer; padding: 16px; }
.anterior { left: 0; }
.proxima { right: 0; }
.galeria-nome { text-align: center; color: white; padding: 10px; }
</style>
</head>
<body>
<div class="card">
<img src="logo-lidelmed.jpg" alt="LIDEL MED" style="max-width: 180px; display: block; margin: 0 auto 10px;">

<div class="letreiro">
    <p>LIDEL MED FRETE GRÁTIS PARA ITABUNA • LIDEL MED FRETE GRÁTIS PARA ITABUNA •</p>
</div>

<h1 style="color: #d32f2f;">LIDEL MED FRETE GRÁTIS</h1>
<div id="produtos">Carregando produtos...</div>
<a href="https://lidelmed.com.br" class="btn">🌐 Acessar Site Completo LIDEL MED</a>
<h2 style="color: #ff9800;">Fale Conosco</h2>
</div>

<!-- MODAL DA GALERIA -->
<div id="galeria-modal" class="modal">
  <span class="fechar" onclick="fecharGaleria()">X</span>
  <span class="seta anterior" onclick="imagemAnterior()"><</span>
  <img class="galeria-conteudo" id="galeria-img">
  <span class="seta proxima" onclick="proximaImagem()">></span>
  <div id="galeria-nome" class="galeria-nome"></div>
</div>

<script src="script.js?v=131"></script>
v=129"></script>
</body>
</html>
