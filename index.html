<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lidelmed</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
    <style>
.product {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    background: white;
    cursor: pointer;
    transition: 0.3s;
}
.product:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
.product img { width: 100%; height: 200px; object-fit: contain; margin-bottom: 10px; }
header { background: #ff9800; color: #cc0000; padding: 15px 0; text-align: center; }
header h1 { margin: 0; font-size: 28px; font-weight: bold; }
.marquee{ width: 100%; overflow: hidden; background: #d32f2f; color: white; margin: 5px 0; }
.marquee-content { display: inline-block; padding-left: 100%; white-space: nowrap; animation: marquee 15s linear infinite; }
@keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-100%); } }
.whatsapp-btn, .app-btn { display: inline-block; padding: 10px 15px; margin: 5px; border-radius: 8px; text-decoration: none; color: white; font-weight: bold; }
.whatsapp-btn { background: #25D366; }
.app-btn { background: #007bff; }
#searchInput { width: 90%; max-width: 500px; padding: 10px; margin: 15px auto; display: block; border: 1px solid #ccc; border-radius: 5px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
.modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
.modal-content { background: white; margin: 5% auto; padding: 20px; border-radius: 10px; width: 90%; max-width: 600px; position: relative; }
.close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
.modal-nav { display: flex; justify-content: space-between; margin-top: 15px; }
</style>
    <header>
    <h1>Lidelmed</h1>
    <div class="marquee">
        <div class="marquee-content">FRETE GRÁTIS PARA ITABUNA E ILHÉUS</div>
    </div>
    <div style="padding: 10px;">
        <a class="whatsapp-btn" href="https://wa.me/557399144898" target="_blank">Falar no WhatsApp</a>
        <a class="app-btn" href="#" target="_blank">Baixar Aplicativo</a>
    </div>
</header>
<main>
    <input type="text" id="searchInput" placeholder="Pesquisar produto...">
    <div id="grid" class="grid"></div>
</main>

<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <img id="modalImg" src="" alt="">
        <h2 id="modalNome"></h2>
        <p id="modalAVista"></p>
        <p id="modalAP"></p>
        <a id="modalZap" href="#" target="_blank">Falar no WhatsApp</a>
        <div class="modal-nav">
            <button id="prevBtn">Anterior</button>
            <button id="nextBtn">Próximo</button>
        </div>
    </div>
</div>

<script>
let produtos = [];
let produtoAtual = 0;

const grid = document.getElementById('grid');
const modal = document.getElementById('modal');

fetch('/produtos.json')
.then(res => res.json())
.then(data => {
    produtos = data;
    mostrarProdutos();
});

function mostrarProdutos(){
    grid.innerHTML = '';
    produtos.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = 'product';
        card.innerHTML = `
            <img src="${p.imagem}" alt="${p.nome}">
            <h3>${p.nome}</h3>
            <p class="preco">R$ ${p.preco_avista}</p>
            <p class="cartao">R$ ${p.preco_cartao} no cartão</p>
        `;
        card.onclick = () => abrirModal(i);
        grid.appendChild(card);
    });
}

function abrirModal(i){
    produtoAtual = i;
    const p = produtos[produtoAtual]; // <-- MUDOU SÓ AQUI
document.getElementById('modalImg').src = `${p.imagem}`;
document.getElementById('modalNome').innerText = p.nome;
document.getElementById('modalAVista').innerText = `R$ ${p.preco_avista}`;
document.getElementById('modalAP').innerText = `R$ ${p.preco_cartao} no cartão`;
document.getElementById('modalZap').href = `https://wa.me/557399144898?text=Olá, quero o produto: ${p.nome}`;
    modal.style.display = 'block';
}
document.querySelector('.close').onclick = () => modal.style.display = 'none';
document.getElementById('prevBtn').onclick = () => { if(produtoAtual > 0) abrirModal(produtoAtual - 1); }
document.getElementById('nextBtn').onclick = () => { if(produtoAtual < produtos.length - 1) abrirModal(produtoAtual + 1); }

document.getElementById('searchInput').addEventListener('input', (e) => {
    const termo = e.target.value.toLowerCase();
    const filtrados = produtos.filter(p => p.nome.toLowerCase().includes(termo));
    grid.innerHTML = '';
    filtrados.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = 'product';
        card.innerHTML = `
            <img src="/${p.imagem}" alt="${p.nome}">
            <h3>${p.nome}</h3>
            <p class="preco">R$ ${p.preco_avista}</p>
            <p class="cartao">R$ ${p.preco_cartao} no cartão</p>
        `;
       card.onclick = () => abrirModal(produtos.indexOf(p));
        grid.appendChild(card);
    });
});
</script>

</body>
</html>
